[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.0",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "tqdm>=4.68.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
